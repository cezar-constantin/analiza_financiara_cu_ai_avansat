<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analiză financiară și instrumente AI · nivel avansat</title>
    <meta
      name="description"
      content="Trei instrumente didactice construite pe populația de 1,12 milioane de bilanțuri depuse la Ministerul Finanțelor: laborator de model de risc, percentile pe sector și laborator de anomalii de raportare."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <nav class="card site-nav" id="site-nav" aria-label="Site"></nav>

      <header class="hero card">
        <div class="hero-copy">
          <p class="eyebrow" data-i18n="home.eyebrow"></p>
          <h1 class="compact" data-i18n="home.title"></h1>
          <p class="hero-text" data-i18n="home.text"></p>
          <div class="hero-flow">
            <span class="flow-chip">RO / EN</span>
            <span class="flow-chip">data.gov.ro · MFP</span>
            <span class="flow-chip" data-i18n="adv.level"></span>
          </div>
        </div>
        <div class="hero-badges">
          <article class="metric-chip">
            <span class="metric-label" data-i18n="a.pop"></span>
            <strong id="hero-count">1.122.150</strong>
          </article>
          <article class="metric-chip">
            <span class="metric-label" data-i18n="hero.years"></span>
            <strong id="hero-years">2023 – 2025</strong>
          </article>
          <article class="metric-chip">
            <span class="metric-label" data-i18n="ent.sector"></span>
            <strong id="hero-sectors">88</strong>
          </article>
        </div>
      </header>

      <section class="tool-grid">
        <article class="card tool-card">
          <p class="section-kicker">1</p>
          <h2 data-i18n="home.model.title"></h2>
          <p class="helper-copy" data-i18n="home.model.text"></p>
          <a class="primary-button" href="./model.html" data-i18n="home.open"></a>
        </article>
        <article class="card tool-card">
          <p class="section-kicker">2</p>
          <h2 data-i18n="home.sector.title"></h2>
          <p class="helper-copy" data-i18n="home.sector.text"></p>
          <a class="primary-button" href="./sector.html" data-i18n="home.open"></a>
        </article>
        <article class="card tool-card">
          <p class="section-kicker">3</p>
          <h2 data-i18n="home.anom.title"></h2>
          <p class="helper-copy" data-i18n="home.anom.text"></p>
          <a class="primary-button" href="./anomalii.html" data-i18n="home.open"></a>
        </article>
      </section>

      <section class="card workspace-card">
        <div class="section-heading">
          <div>
            <p class="section-kicker" data-i18n="home.note.kicker"></p>
            <h2 data-i18n="home.note.title"></h2>
          </div>
          <span class="status-pill" data-i18n="adv.populationPill"></span>
        </div>
        <p class="helper-copy" data-i18n="home.note.p1"></p>
        <p class="helper-copy" data-i18n="home.note.p2"></p>
        <p class="helper-copy" data-i18n="home.note.p3"></p>
      </section>

      <section class="footer-panel-grid" id="site-footer"></section>
    </div>

    <div class="toast" id="toast" hidden></div>
    <script type="module">
      import { renderAdvShell } from "./adv.js";
      renderAdvShell("home");
    </script>
  </body>
</html>
